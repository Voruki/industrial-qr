<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Intralogistics Facility - 3D QR</title>
    <!-- Stable CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #080b12;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        user-select: none;
      }
      #webgl-container {
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
      }
      #webgl-container:active {
        cursor: grabbing;
      }

      /* Floating Hint Badge */
      .tap-badge {
        position: absolute;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 26, 38, 0.88);
        backdrop-filter: blur(12px);
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 500;
        padding: 7px 18px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tap-badge:hover {
        background: rgba(37, 99, 235, 0.9);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateX(-50%) translateY(-2px);
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
      }

      /* Bottom Input Bar */
      .bottom-bar {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 520px;
        display: flex;
        gap: 8px;
        background: rgba(14, 18, 28, 0.94);
        backdrop-filter: blur(16px);
        padding: 8px 10px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.9);
        z-index: 10;
      }
      .bottom-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 12px 18px;
        border-radius: 14px;
        color: #ffffff;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      .bottom-input:focus {
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.09);
      }
      .submit-btn {
        background: #2563eb;
        color: #ffffff;
        border: none;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .submit-btn:hover { background: #1d4ed8; }
      .submit-btn:active { transform: scale(0.95); }
    </style>
  </head>
  <body>
    <!-- Floating Hint Badge -->
    <div id="tap-badge" class="tap-badge">
      <span class="pulse-dot"></span>
      <span id="badge-text">Tap the warehouse to see QR code</span>
    </div>

    <!-- Bottom Input Bar -->
    <div class="bottom-bar">
      <input id="qr-input" class="bottom-input" type="text" value="https://voruki.github.io/industrial-qr/" placeholder="Type any link or text..." />
      <button id="submit-btn" class="submit-btn" title="Update Grid">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <div id="webgl-container"></div>

    <script>
      // --- INDUSTRIAL COLOR PALETTE ---
      const PALETTE = {
        // Floor Colors
        floorCenter3D:  new THREE.Color('#47505e'), // Concrete grey under spotlight
        floorEdge3D:    new THREE.Color('#11151e'), // Charcoal blend into void
        floorScanLight: new THREE.Color('#ffffff'), // High-contrast scan white

        trackCenter3D:  new THREE.Color('#222936'),
        trackEdge3D:    new THREE.Color('#0b0e14'),
        trackScanDark:  new THREE.Color('#000000'), // High-contrast scan black

        // Heavy Racking
        rackUpright: '#1E3A8A',    // RAL 5010 Blue
        rackBeam:    '#C2410C',    // RAL 2004 Deep Orange
        woodPallet:  '#78350F',

        // Cargo
        cargoBox:    '#64748B',    // Matte industrial grey
        cargoBoxAlt: '#92400E',    // Matte kraft carton

        // High-Bay Red Priority Bins (Deep, rich matte red)
        highBayCargo:    '#991B1B', // RAL 3001 Crimson Red
        highBayCargoAlt: '#7F1D1D', // RAL 3000 Burgundy

        // Material Handling Fleet
        forkliftBody: '#D97706',   // Deep industrial amber-yellow (not washed out)
        forkliftCab:  '#0F172A',
        forkliftMast: '#334155',

        amrChassis:  '#B45309',
        amrBase:     '#1E293B',
        amrTote:     '#1D4ED8',

        conveyorLeg: '#334155',
        conveyorRoller: '#94A3B8',
        bollardYellow: '#EAB308',
        chargePad: '#059669'
      };

      // --- THREE.JS SETUP ---
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#080b12');

      let width = window.innerWidth;
      let height = window.innerHeight;

      const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
      const isoPos = new THREE.Vector3(38, 44, 38);
      // Pulled back higher (Y=80) and shifted north (Z=-4.5) to clear bottom UI
      const flatPos = new THREE.Vector3(0, 80, -4.5);
      camera.position.copy(isoPos);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // --- ORBIT CONTROLS ---
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 18;
      controls.maxDistance = 115;
      controls.target.set(0, 0, 0);

      // --- LIGHTING SETUP ---
      // Calibrated to prevent white blowout
      const ambientLight = new THREE.AmbientLight('#ffffff', 0.8);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight('#fffbeb', 1.6);
      sunLight.position.set(30, 65, 25);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 160;
      const d = 35;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight('#38bdf8', 0.3);
      fillLight.position.set(-30, 20, -30);
      scene.add(fillLight);

      // --- MATTE MATERIAL SYSTEM (ELIMINATES SPECULAR GLARE) ---
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const unitMaterial = new THREE.MeshStandardMaterial({
        roughness: 0.92, // High roughness = zero specular blowout
        metalness: 0.02
      });

      let instancedMesh = null;
      const dummy = new THREE.Object3D();
      const tempColor = new THREE.Color();
      let currentInstance = 0;

      let floorData = [];
      let dynamicFleet = [];

      function addBlock(x, y, z, sx, sy, sz, colorHex) {
        if (!instancedMesh) return -1;
        const idx = currentInstance;
        dummy.position.set(x, y + sy / 2, z);
        dummy.scale.set(sx, sy, sz);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(idx, dummy.matrix);
        instancedMesh.setColorAt(idx, tempColor.set(colorHex));
        currentInstance++;
        return idx;
      }

      function spawnAlignedRackBay(x, z, tiers, isHighBay = false) {
        const tierHeight = 0.88;
        const totalHeight = tiers * tierHeight;
        const postW = 0.08;
        const offset = 0.42;

        addBlock(x - offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x - offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);

        for (let t = 0; t < tiers; t++) {
          const y = t * tierHeight;
          addBlock(x, y, z - offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x, y, z + offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x - offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);
          addBlock(x + offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);

          addBlock(x, y + 0.06, z, 0.78, 0.07, 0.78, PALETTE.woodPallet);

          let boxColor;
          if (isHighBay) {
            boxColor = (x + z + t) % 2 === 0 ? PALETTE.highBayCargo : PALETTE.highBayCargoAlt;
          } else {
            boxColor = (x + z + t) % 2 === 0 ? PALETTE.cargoBox : PALETTE.cargoBoxAlt;
          }
          addBlock(x, y + 0.13, z, 0.68, 0.50, 0.68, boxColor);
        }
      }

      function spawnForklift(x, z, axis = 'x') {
        const parts = [];
        function addForkliftPart(ox, oy, oz, sx, sy, sz, color) {
          const idx = addBlock(x + ox, oy, z + oz, sx, sy, sz, color);
          parts.push({ ox, oy, oz, sx, sy, sz, idx });
        }

        addForkliftPart(0, 0.05, 0.1, 0.65, 0.35, 0.55, PALETTE.forkliftBody);
        addForkliftPart(-0.24, 0.40, -0.05, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addForkliftPart(0.24, 0.40, -0.05, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addForkliftPart(-0.24, 0.40, 0.25, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addForkliftPart(0.24, 0.40, 0.25, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addForkliftPart(0, 0.90, 0.1, 0.55, 0.04, 0.55, PALETTE.forkliftCab);
        addForkliftPart(-0.18, 0.05, -0.25, 0.06, 1.15, 0.06, PALETTE.forkliftMast);
        addForkliftPart(0.18, 0.05, -0.25, 0.06, 1.15, 0.06, PALETTE.forkliftMast);
        addForkliftPart(0, 0.15, -0.38, 0.55, 0.06, 0.55, PALETTE.woodPallet);
        addForkliftPart(0, 0.21, -0.38, 0.48, 0.40, 0.48, PALETTE.cargoBoxAlt);

        dynamicFleet.push({
          baseX: x, baseZ: z, axis: axis,
          range: 0.32, speed: 1.2 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          parts: parts
        });
      }

      function spawnAMR(x, z, axis = 'z') {
        const parts = [];
        function addAMRPart(ox, oy, oz, sx, sy, sz, color) {
          const idx = addBlock(x + ox, oy, z + oz, sx, sy, sz, color);
          parts.push({ ox, oy, oz, sx, sy, sz, idx });
        }

        addAMRPart(0, 0.05, 0, 0.76, 0.14, 0.76, PALETTE.amrBase);
        addAMRPart(0, 0.19, 0, 0.68, 0.16, 0.68, PALETTE.amrChassis);
        addAMRPart(0, 0.35, 0, 0.54, 0.24, 0.54, PALETTE.amrTote);

        dynamicFleet.push({
          baseX: x, baseZ: z, axis: axis,
          range: 0.28, speed: 1.8 + Math.random() * 0.6,
          phase: Math.random() * Math.PI * 2,
          parts: parts
        });
      }

      function spawnPalletStack(x, z) {
        for (let i = 0; i < 4; i++) {
          addBlock(x, i * 0.11, z, 0.76, 0.08, 0.76, PALETTE.woodPallet);
        }
      }

      function spawnConveyor(x, z, horizontal) {
        addBlock(x, 0.05, z, horizontal ? 0.94 : 0.60, 0.25, horizontal ? 0.60 : 0.94, PALETTE.conveyorLeg);
        addBlock(x, 0.30, z, horizontal ? 0.90 : 0.52, 0.06, horizontal ? 0.52 : 0.90, PALETTE.conveyorRoller);
        addBlock(x, 0.36, z, 0.48, 0.26, 0.48, PALETTE.amrTote);
      }

      function spawnChargingDock(x, z) {
        addBlock(x, 0.04, z, 0.82, 0.06, 0.82, PALETTE.amrBase);
        addBlock(x, 0.10, z, 0.50, 0.04, 0.50, PALETTE.chargePad);
      }

      function spawnSafetyBollards(x, z) {
        const offset = 0.28;
        addBlock(x - offset, 0.05, z - offset, 0.14, 0.75, 0.14, PALETTE.bollardYellow);
        addBlock(x + offset, 0.05, z + offset, 0.14, 0.75, 0.14, PALETTE.bollardYellow);
      }

      // --- FACILITY GENERATOR ---
      function generateFacility(text) {
        if (instancedMesh) {
          scene.remove(instancedMesh);
          instancedMesh.geometry.dispose();
          instancedMesh = null;
        }

        floorData = [];
        dynamicFleet = [];
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const size = qr.getModuleCount();
        const center = size / 2;
        const maxRadius = size * 0.707;
        
        const highBayRadius = size * 0.18;
        const rackRadius = size * 0.37;

        instancedMesh = new THREE.InstancedMesh(boxGeo, unitMaterial, 20000);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        currentInstance = 0;

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isDark = qr.isDark(r, c);
            const posX = c - center + 0.5;
            const posZ = r - center + 0.5;
            const dist = Math.hypot(posX, posZ);
            const normDist = Math.min(1.0, dist / maxRadius);

            const colLight3D = new THREE.Color().lerpColors(PALETTE.floorCenter3D, PALETTE.floorEdge3D, normDist * 0.95);
            const colDark3D  = new THREE.Color().lerpColors(PALETTE.trackCenter3D, PALETTE.trackEdge3D, normDist * 0.95);

            if (!isDark) {
              const idx = addBlock(posX, 0, posZ, 0.98, 0.08, 0.98, '#47505e');
              floorData.push({ idx, type: 'light', col3D: colLight3D });
            } else {
              const idx = addBlock(posX, 0, posZ, 0.98, 0.10, 0.98, '#222936');
              floorData.push({ idx, type: 'dark', col3D: colDark3D });

              if (dist < highBayRadius) {
                spawnAlignedRackBay(posX, posZ, 5, true);
              } else if (dist < rackRadius) {
                spawnAlignedRackBay(posX, posZ, 3, false);
              } else {
                const seed = (r * 13 + c * 7);

                if (seed % 17 === 0) {
                  spawnForklift(posX, posZ, (r % 2 === 0 ? 'x' : 'z'));
                } else if (seed % 19 === 1) {
                  spawnConveyor(posX, posZ, r % 2 === 0);
                } else if (seed % 13 === 2) {
                  spawnPalletStack(posX, posZ);
                } else if (seed % 23 === 3) {
                  spawnChargingDock(posX, posZ);
                } else if (seed % 21 === 4) {
                  spawnSafetyBollards(posX, posZ);
                } else if (seed % 4 === 0) {
                  spawnAMR(posX, posZ, (c % 2 === 0 ? 'z' : 'x'));
                }
              }
            }
          }
        }

        instancedMesh.count = currentInstance;
        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        updateFloorContrast(0);
      }

      const input = document.getElementById('qr-input');
      generateFacility(input.value.trim());

      // --- FLOOR CONTRAST INTERPOLATION ---
      const contrastState = { progress: 0 };

      function updateFloorContrast(progress) {
        if (!instancedMesh) return;
        const scratch = new THREE.Color();

        for (let i = 0; i < floorData.length; i++) {
          const item = floorData[i];
          if (item.type === 'light') {
            scratch.lerpColors(item.col3D, PALETTE.floorScanLight, progress);
          } else {
            scratch.lerpColors(item.col3D, PALETTE.trackScanDark, progress);
          }
          instancedMesh.setColorAt(item.idx, scratch);
        }
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
      }

      // --- VIEW TOGGLE ---
      let isFlat = false;
      const tapBadge = document.getElementById('tap-badge');
      const badgeText = document.getElementById('badge-text');

      function toggleView() {
        isFlat = !isFlat;
        badgeText.textContent = isFlat ? "Tap to see 3D view" : "Tap the warehouse to see QR code";

        if (isFlat) {
          controls.enabled = false;
          // Frames the QR code above the bottom bar
          gsap.to(camera.position, {
            x: flatPos.x, y: flatPos.y, z: flatPos.z,
            duration: 1.2,
            ease: "power3.inOut"
          });
          gsap.to(controls.target, { x: 0, y: 0, z: -4.5, duration: 1.2 });
        } else {
          gsap.to(camera.position, {
            x: isoPos.x, y: isoPos.y, z: isoPos.z,
            duration: 1.2,
            ease: "power3.inOut",
            onComplete: () => { controls.enabled = true; }
          });
          gsap.to(controls.target, { x: 0, y: 0, z: 0, duration: 1.2 });
        }

        // Smooth contrast ramp
        gsap.to(contrastState, {
          progress: isFlat ? 1 : 0,
          duration: 1.2,
          ease: "power2.inOut",
          onUpdate: () => updateFloorContrast(contrastState.progress)
        });

        // Non-specular, balanced lighting in scan mode
        gsap.to(sunLight, { intensity: isFlat ? 0.7 : 1.6, duration: 1.2 });
        gsap.to(ambientLight, { intensity: isFlat ? 1.05 : 0.8, duration: 1.2 });
      }

      tapBadge.addEventListener('click', toggleView);

      // Canvas tap detection
      let pointerDownPos = { x: 0, y: 0 };
      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.bottom-bar') || e.target.closest('.tap-badge')) return;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 6) {
          toggleView();
        }
      });

      // Submit new URL
      const submitBtn = document.getElementById('submit-btn');
      function handleUpdate() {
        if (input.value.trim().length > 0) {
          generateFacility(input.value.trim());
        }
      }
      submitBtn.addEventListener('click', handleUpdate);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleUpdate();
      });

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });

      // --- ANIMATION LOOP ---
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        if (controls.enabled) {
          controls.update();
        }

        // Animate fleet when in 3D mode
        if (instancedMesh && !isFlat) {
          for (let f = 0; f < dynamicFleet.length; f++) {
            const unit = dynamicFleet[f];
            const moveOffset = Math.sin(elapsedTime * unit.speed + unit.phase) * unit.range;

            for (let p = 0; p < unit.parts.length; p++) {
              const part = unit.parts[p];
              const curX = unit.axis === 'x' ? unit.baseX + part.ox + moveOffset : unit.baseX + part.ox;
              const curZ = unit.axis === 'z' ? unit.baseZ + part.oz + moveOffset : unit.baseZ + part.oz;

              dummy.position.set(curX, part.oy + part.sy / 2, curZ);
              dummy.scale.set(part.sx, part.sy, part.sz);
              dummy.rotation.set(0, 0, 0);
              dummy.updateMatrix();
              instancedMesh.setMatrixAt(part.idx, dummy.matrix);
            }
          }
          instancedMesh.instanceMatrix.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
