<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Intralogistics Grid - 3D QR</title>
    <!-- Three.js + GSAP + QR Generator via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        user-select: none;
      }
      #webgl-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .ui-overlay {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(14px);
        padding: 8px 12px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 20px 30px -8px rgba(0, 0, 0, 0.8);
        z-index: 10;
      }
      .ui-input {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 9px 18px;
        border-radius: 9999px;
        color: #fff;
        outline: none;
        font-size: 14px;
        min-width: 260px;
      }
      .ui-input:focus { border-color: #3b82f6; }
      .ui-btn {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 9px 20px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }
      .ui-btn:hover { background: #1d4ed8; }
      .hint {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="ui-overlay">
      <input id="qr-input" class="ui-input" type="text" value="https://voruki.github.io/industrial-qr/" placeholder="Enter URL or text..." />
      <button id="toggle-btn" class="ui-btn">Flatten to Scan</button>
    </div>
    <div class="hint">Click & drag to orbit · Tap button to scan</div>
    <div id="webgl-container"></div>

    <script>
      // --- INDUSTRIAL COLOR PALETTE ---
      const PALETTE = {
        floorLight: '#EDEDED',     // Polished concrete (Light Module 0)
        floorTrack: '#1E2430',     // Dark guide tile / transit track (Dark Module 1)
        steelBlue: '#1E3A8A',      // RAL 5010 Upright frame posts
        beamOrange: '#EA580C',     // RAL 2004 Heavy load crossbars
        toteGrey: '#334155',       // Polypropylene storage bins
        toteBlue: '#2563EB',       // Order picking tote
        amrBase: '#0F172A',        // Robot drive chassis
        amrYellow: '#EAB308',      // RAL 1023 Safety yellow shell
        amrTray: '#C2410C',        // Top tilt-tray / parcel carrier
        boxCardboard: '#A16207'    // Parcel on robot
      };

      // --- SCENE & LIGHTING ---
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#090d16');

      let width = window.innerWidth;
      let height = window.innerHeight;

      const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
      const isoPos = new THREE.Vector3(34, 40, 34);
      const flatPos = new THREE.Vector3(0, 58, -0.001);
      camera.position.copy(isoPos);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight('#ffffff', 1.0);
      scene.add(ambientLight);

      // Industrial high-bay overhead lighting
      const sunLight = new THREE.DirectionalLight('#fffbeb', 2.0);
      sunLight.position.set(30, 60, 25);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 150;
      const d = 32;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight('#38bdf8', 0.5);
      rimLight.position.set(-30, 15, -30);
      scene.add(rimLight);

      // --- INSTANCED RENDERING SYSTEM ---
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 });

      let instMesh = null;
      const dummy = new THREE.Object3D();
      const colorHelper = new THREE.Color();
      let count = 0;

      function spawn(x, y, z, sx, sy, sz, colorHex) {
        if (!instMesh) return;
        dummy.position.set(x, y + sy / 2, z);
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        instMesh.setMatrixAt(count, dummy.matrix);
        instMesh.setColorAt(count, colorHelper.set(colorHex));
        count++;
      }

      // Procedural AS/RS Rack Column: 4 upright posts, orange beams, and storage totes inside
      function spawnRackColumn(x, z, tiers) {
        const tierH = 0.95;
        const totalH = tiers * tierH;
        const postW = 0.08;
        const offset = 0.42;

        // 4 Vertical Steel Upright Columns (Blue)
        spawn(x - offset, 0, z - offset, postW, totalH, postW, PALETTE.steelBlue);
        spawn(x + offset, 0, z - offset, postW, totalH, postW, PALETTE.steelBlue);
        spawn(x - offset, 0, z + offset, postW, totalH, postW, PALETTE.steelBlue);
        spawn(x + offset, 0, z + offset, postW, totalH, postW, PALETTE.steelBlue);

        // Shelves and nested Bins
        for (let t = 0; t < tiers; t++) {
          const y = t * tierH;
          // Load Beams (Orange)
          spawn(x, y, z - offset, 0.92, 0.06, postW, PALETTE.beamOrange);
          spawn(x, y, z + offset, 0.92, 0.06, postW, PALETTE.beamOrange);
          spawn(x - offset, y, z, postW, 0.06, 0.92, PALETTE.beamOrange);
          spawn(x + offset, y, z, postW, 0.06, 0.92, PALETTE.beamOrange);

          // Industrial Tote Bin sitting inside shelf bay
          const binColor = (x + z + t) % 3 === 0 ? PALETTE.toteBlue : PALETTE.toteGrey;
          spawn(x, y + 0.06, z, 0.74, 0.48, 0.74, binColor);
        }
      }

      // Procedural AMR Sorting Robot: Drive base, safety yellow shell, sensor dome, tilt-tray & parcel
      function spawnAMR(x, y, z) {
        // Dark Wheeled Chassis Base
        spawn(x, y, z, 0.86, 0.12, 0.86, PALETTE.amrBase);
        // Safety Yellow Main Body
        spawn(x, y + 0.12, z, 0.78, 0.18, 0.78, PALETTE.amrYellow);
        // Black Laser Radar Dome / Center Hub
        spawn(x, y + 0.30, z, 0.22, 0.08, 0.22, PALETTE.amrBase);
        // Top Tilt-Tray / Sorter Table
        spawn(x, y + 0.38, z, 0.70, 0.06, 0.70, PALETTE.amrTray);
        // Mini Cardboard Parcel
        spawn(x, y + 0.44, z, 0.42, 0.22, 0.42, PALETTE.boxCardboard);
      }

      // --- WAREHOUSE GENERATOR ---
      function generateGrid(text) {
        if (instMesh) {
          scene.remove(instMesh);
          instMesh.geometry.dispose();
          instMesh = null;
        }

        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const size = qr.getModuleCount();
        const center = size / 2;
        const maxRadius = size * 0.40;

        // Allocate maximum instances for detailed structural parts
        instMesh = new THREE.InstancedMesh(boxGeo, mat, 12000);
        instMesh.castShadow = true;
        instMesh.receiveShadow = true;
        count = 0;

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isDark = qr.isDark(r, c);
            const posX = c - center + 0.5;
            const posZ = r - center + 0.5;
            const dist = Math.hypot(posX, posZ);

            if (!isDark) {
              // LIGHT MODULE: Polished Concrete Floor Slab
              spawn(posX, 0, posZ, 0.98, 0.10, 0.98, PALETTE.floorLight);
            } else {
              // DARK MODULE: Steel Transit Guide Tile Base
              spawn(posX, 0, posZ, 0.98, 0.12, 0.98, PALETTE.floorTrack);

              // 1. Center High-Density AS/RS Storage Tower (4 to 5 Tiers)
              if (dist < 3.2) {
                spawnRackColumn(posX, posZ, 5);
              } 
              // 2. Mid-Zone Tiered Racking (2 to 3 Tiers Dome)
              else if (dist < maxRadius) {
                const normalized = 1 - (dist / maxRadius);
                const tiers = Math.max(1, Math.round(3.5 * Math.pow(normalized, 1.4)));
                spawnRackColumn(posX, posZ, tiers);

                // Dock an AMR on top of outer low racks
                if (tiers === 1 && (r + c) % 3 === 0) {
                  spawnAMR(posX, 0.95, posZ);
                }
              } 
              // 3. Ground Fleet: Active Sorting AMRs along transit lanes
              else {
                // Populate realistic fleet spacing rather than choking every square
                if ((r * 7 + c * 13) % 4 === 0) {
                  spawnAMR(posX, 0.12, posZ);
                }
              }
            }
          }
        }

        instMesh.count = count;
        instMesh.instanceMatrix.needsUpdate = true;
        if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
        scene.add(instMesh);
      }

      // Initial Build
      const input = document.getElementById('qr-input');
      generateGrid(input.value.trim());

      // --- CAMERA FLATTEN & REVEAL ---
      let isFlat = false;
      let autoRotate = true;
      const toggleBtn = document.getElementById('toggle-btn');

      function toggleView() {
        isFlat = !isFlat;
        autoRotate = false;
        toggleBtn.textContent = isFlat ? "3D Automation View" : "Flatten to Scan";
        const target = isFlat ? flatPos : isoPos;

        gsap.to(camera.position, {
          x: target.x,
          y: target.y,
          z: target.z,
          duration: 1.2,
          ease: "power3.inOut",
          onUpdate: () => camera.lookAt(0, 0, 0)
        });

        // Soften shadows during scan mode for crisp barcode reading
        gsap.to(sunLight, { intensity: isFlat ? 1.1 : 2.0, duration: 1.2 });
        gsap.to(ambientLight, { intensity: isFlat ? 1.8 : 1.0, duration: 1.2 });
      }

      toggleBtn.addEventListener('click', toggleView);

      input.addEventListener('change', () => {
        if (input.value.trim().length > 0) generateGrid(input.value.trim());
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim().length > 0) generateGrid(input.value.trim());
      });

      // --- MOUSE / TOUCH DRAG ORBIT ---
      let isDragging = false;
      let prevPointer = { x: 0, y: 0 };

      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        isDragging = true;
        autoRotate = false;
        prevPointer = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging || isFlat) return;
        const deltaX = (e.clientX - prevPointer.x) * 0.006;
        const deltaY = (e.clientY - prevPointer.y) * 0.006;

        const radius = Math.hypot(camera.position.x, camera.position.z);
        let angle = Math.atan2(camera.position.z, camera.position.x) + deltaX;

        camera.position.x = radius * Math.cos(angle);
        camera.position.z = radius * Math.sin(angle);
        camera.position.y = Math.max(14, Math.min(65, camera.position.y - deltaY * 16));
        camera.lookAt(0, 0, 0);

        prevPointer = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', () => { isDragging = false; });

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });

      function animate() {
        requestAnimationFrame(animate);

        if (autoRotate && !isFlat && !isDragging) {
          const radius = Math.hypot(camera.position.x, camera.position.z);
          let angle = Math.atan2(camera.position.z, camera.position.x) + 0.0025;
          camera.position.x = radius * Math.cos(angle);
          camera.position.z = radius * Math.sin(angle);
          camera.lookAt(0, 0, 0);
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
