<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Intralogistics Facility - 3D QR</title>
    <!-- Stable CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #fef3c7;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        user-select: none;
        transition: background-color 1.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Fluid Ambient Pastel Mesh Backdrop */
      #abstract-bg {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
        background-color: #fef3c7;
        transition: background-color 1.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glow-blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.70;
        will-change: transform;
        transition: background 1.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.4s ease;
      }

      .blob-1 {
        width: 68vw;
        height: 68vw;
        min-width: 540px;
        min-height: 540px;
        bottom: -15%;
        right: -8%;
        animation: floatBlob1 22s infinite alternate ease-in-out;
      }

      .blob-2 {
        width: 60vw;
        height: 60vw;
        min-width: 460px;
        min-height: 460px;
        top: -14%;
        right: 15%;
        animation: floatBlob2 26s infinite alternate ease-in-out;
      }

      .blob-3 {
        width: 75vw;
        height: 75vw;
        min-width: 580px;
        min-height: 580px;
        bottom: -12%;
        left: -16%;
        animation: floatBlob3 30s infinite alternate ease-in-out;
      }

      .bg-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transition: background 1.4s ease;
      }

      @keyframes floatBlob1 {
        0% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(-16vw, -14vh, 0) scale(1.15); }
        100% { transform: translate3d(-8vw, 6vh, 0) scale(0.92); }
      }

      @keyframes floatBlob2 {
        0% { transform: translate3d(0, 0, 0) scale(0.92); }
        50% { transform: translate3d(14vw, 15vh, 0) scale(1.18); }
        100% { transform: translate3d(-12vw, 8vh, 0) scale(1.02); }
      }

      @keyframes floatBlob3 {
        0% { transform: translate3d(0, 0, 0) scale(1.05); }
        50% { transform: translate3d(18vw, -14vh, 0) scale(0.88); }
        100% { transform: translate3d(8vw, -5vh, 0) scale(1.14); }
      }

      #webgl-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: block;
        cursor: grab;
        z-index: 1;
      }
      #webgl-container:active {
        cursor: grabbing;
      }

      /* Floating Hint Badge */
      .tap-badge {
        position: absolute;
        bottom: 136px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(15, 23, 42, 0.88);
        backdrop-filter: blur(14px);
        color: #f1f5f9;
        font-size: 13px;
        font-weight: 500;
        padding: 7px 18px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        transition: all 0.2s ease;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tap-badge:hover {
        background: rgba(37, 99, 235, 0.95);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.45);
        transform: translateX(-50%) translateY(-2px);
      }
      .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
      }

      /* Bottom Control Panel Stack */
      .bottom-control-panel {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 10;
      }

      /* Typing & Action Bar */
      .bottom-bar {
        width: 100%;
        display: flex;
        gap: 8px;
        background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(18px);
        padding: 7px 9px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.4);
      }
      .bottom-input {
        flex: 1;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 11px 16px;
        border-radius: 14px;
        color: #ffffff;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      .bottom-input:focus {
        border-color: #3b82f6;
        background: rgba(255, 255, 255, 0.14);
      }
      .action-btn {
        background: #2563eb;
        color: #ffffff;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .action-btn:hover { background: #1d4ed8; }
      .action-btn:active { transform: scale(0.95); }

      .share-btn {
        background: rgba(217, 119, 6, 0.95);
      }
      .share-btn:hover { background: rgb(180, 83, 9); }

      /* Modes and Audio Switcher Row */
      .mode-row {
        width: 100%;
        display: flex;
        gap: 8px;
      }
      .mode-selector {
        flex: 1;
        display: flex;
        background: rgba(15, 23, 42, 0.90);
        backdrop-filter: blur(16px);
        padding: 4px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
      }
      .mode-tab {
        flex: 1;
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 4px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
        white-space: nowrap;
      }
      .mode-tab.active {
        background: rgba(255, 255, 255, 0.20);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      .mode-tab:hover:not(.active) {
        color: #f1f5f9;
        background: rgba(255, 255, 255, 0.08);
      }
      .audio-btn {
        background: rgba(15, 23, 42, 0.90);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #94a3b8;
        width: 44px;
        height: 44px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
      }
      .audio-btn:hover {
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.35);
      }
      .audio-btn.active {
        color: #38bdf8;
      }

      /* Notification Toast */
      .toast {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(-30px);
        background: rgba(16, 185, 129, 0.95);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 20px;
        border-radius: 9999px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 100;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Fluid Abstract Pastel Mesh Layer -->
    <div id="abstract-bg">
      <div id="blob-1" class="glow-blob blob-1"></div>
      <div id="blob-2" class="glow-blob blob-2"></div>
      <div id="blob-3" class="glow-blob blob-3"></div>
      <div id="bg-vignette" class="bg-vignette"></div>
    </div>

    <div id="toast" class="toast">Snapshot saved & link copied!</div>

    <!-- Floating Hint Badge -->
    <div id="tap-badge" class="tap-badge">
      <span class="pulse-dot"></span>
      <span id="badge-text">Tap the warehouse to see QR code</span>
    </div>

    <!-- Bottom Control Stack -->
    <div class="bottom-control-panel">
      <!-- Input & Action Bar -->
      <div class="bottom-bar">
        <input id="qr-input" class="bottom-input" type="text" value="https://yongming.vorky.fyi/" placeholder="Type any link or text..." />
        <button id="submit-btn" class="action-btn" title="Update Facility">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <button id="share-btn" class="action-btn share-btn" title="Export Snapshot & Share Link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Mode Switcher Row + Audio Button -->
      <div class="mode-row">
        <div class="mode-selector">
          <button class="mode-tab active" data-mode="day">☀️ Day Shift</button>
          <button class="mode-tab" data-mode="cold">❄️ Cold Storage</button>
          <button class="mode-tab" data-mode="night">🌙 Night Shift</button>
        </div>
        <button id="audio-btn" class="audio-btn" title="Toggle Sound FX">
          <svg id="audio-icon-on" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="audio-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>

    <div id="webgl-container"></div>

    <script>
      // ==========================================
      // 1. STATE & SHIFT-SPECIFIC LIGHTING PALETTES
      // ==========================================
      let isFlat = false;
      let soundEnabled = false;
      let audioCtx = null;
      let activeMode = 'day';

      const THEMES = {
        day: {
          bgBase: '#fef3c7',
          blob1:  'radial-gradient(circle, rgba(249, 115, 22, 0.58) 0%, rgba(251, 146, 60, 0.32) 48%, transparent 75%)',
          blob2:  'radial-gradient(circle, rgba(245, 158, 11, 0.52) 0%, rgba(252, 211, 77, 0.30) 50%, transparent 75%)',
          blob3:  'radial-gradient(circle, rgba(225, 29, 72, 0.35) 0%, rgba(251, 113, 133, 0.18) 45%, transparent 70%)',
          vignette: 'radial-gradient(ellipse at 50% 45%, rgba(67, 20, 7, 0.42) 0%, rgba(154, 52, 18, 0.20) 42%, rgba(254, 240, 138, 0.65) 75%, #fde047 100%)',
          dustColor: 0xb45309,

          // ☀️ Warm Golden Sunlight Reflections
          sunColor: '#fff1dc',
          sunIntensity: 2.4,
          fillColor: '#fed7aa',
          fillIntensity: 0.45,
          ambientColor: '#fffbeb',
          ambientIntensity: 0.85,

          // Reinforced Medium Slate-Grey Concrete Slab
          floorCenter3D:  new THREE.Color('#3f4854'), 
          floorEdge3D:    new THREE.Color('#252d36'), 
          floorScanLight: new THREE.Color('#ffffff'),
          trackCenter3D:  new THREE.Color('#1e2530'), 
          trackEdge3D:    new THREE.Color('#10151c'),
          trackScanDark:  new THREE.Color('#0a0e14'),
          
          rackUpright:    '#1D4ED8',
          rackBeam:       '#EA580C',
          woodPallet:     '#78350F',
          cargoKraft:     '#B45309',
          cargoAmber:     '#92400E',
          cargoTote:      '#2563EB',
          highBayCargo:   '#DC2626',
          highBayCargoAlt:'#991B1B',

          forkliftBody:   '#EAB308',
          forkliftCab:    '#0F172A',
          forkliftMast:   '#334155',
          forkliftBeacon: '#F97316',

          amrChassis:     '#EAB308',
          amrBase:        '#0F172A',
          amrTray:        '#C2410C',
          amrTote:        '#2563EB',

          conveyorLeg:    '#334155',
          conveyorRoller: '#94A3B8',
          bollardYellow:  '#FACC15',
          chargePad:      '#10B981',
          laserColor:     0x38bdf8
        },
        cold: {
          bgBase: '#e0f2fe',
          blob1:  'radial-gradient(circle, rgba(2, 132, 199, 0.55) 0%, rgba(56, 189, 248, 0.30) 48%, transparent 75%)',
          blob2:  'radial-gradient(circle, rgba(14, 165, 233, 0.50) 0%, rgba(125, 211, 252, 0.28) 50%, transparent 75%)',
          blob3:  'radial-gradient(circle, rgba(99, 102, 241, 0.38) 0%, rgba(165, 180, 252, 0.20) 45%, transparent 70%)',
          vignette: 'radial-gradient(ellipse at 50% 45%, rgba(8, 47, 73, 0.45) 0%, rgba(3, 105, 161, 0.18) 42%, rgba(186, 230, 253, 0.65) 75%, #7dd3fc 100%)',
          dustColor: 0x0284c7,

          // ❄️ Glacial Cyan Frost Light Reflections
          sunColor: '#e0f2fe',
          sunIntensity: 2.0,
          fillColor: '#38bdf8',
          fillIntensity: 0.45,
          ambientColor: '#f0f9ff',
          ambientIntensity: 0.85,

          // Reinforced Cool Bluish-Grey Concrete Slab
          floorCenter3D:  new THREE.Color('#334454'), 
          floorEdge3D:    new THREE.Color('#1e2a36'), 
          floorScanLight: new THREE.Color('#ffffff'),
          trackCenter3D:  new THREE.Color('#182432'), 
          trackEdge3D:    new THREE.Color('#0e1620'),
          trackScanDark:  new THREE.Color('#0a111a'),
          
          rackUpright:    '#0284C7',
          rackBeam:       '#38BDF8',
          woodPallet:     '#475569',
          cargoKraft:     '#0369A1',
          cargoAmber:     '#0284C7',
          cargoTote:      '#7DD3FC',
          highBayCargo:   '#0284C7',
          highBayCargoAlt:'#075985',

          forkliftBody:   '#06B6D4',
          forkliftCab:    '#0B132B',
          forkliftMast:   '#475569',
          forkliftBeacon: '#38BDF8',

          amrChassis:     '#06B6D4',
          amrBase:        '#0B132B',
          amrTray:        '#0284C7',
          amrTote:        '#38BDF8',

          conveyorLeg:    '#334155',
          conveyorRoller: '#7DD3FC',
          bollardYellow:  '#38BDF8',
          chargePad:      '#06B6D4',
          laserColor:     0x67e8f9
        },
        night: {
          bgBase: '#020617',
          blob1:  'radial-gradient(circle, rgba(16, 185, 129, 0.50) 0%, rgba(5, 150, 105, 0.25) 48%, transparent 75%)',
          blob2:  'radial-gradient(circle, rgba(245, 158, 11, 0.40) 0%, rgba(217, 119, 6, 0.18) 50%, transparent 75%)',
          blob3:  'radial-gradient(circle, rgba(37, 99, 235, 0.35) 0%, rgba(30, 58, 138, 0.16) 45%, transparent 70%)',
          vignette: 'radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(2, 6, 23, 0.65) 80%, #020617 100%)',
          dustColor: 0x6ee7b7,

          // 🌙 High-Lux Silvery Moonlight (Substantially Brightened!)
          sunColor: '#c7dfff',
          sunIntensity: 2.3,
          fillColor: '#60a5fa',
          fillIntensity: 0.70,
          ambientColor: '#1e293b',
          ambientIntensity: 0.85,

          // Reinforced Dark Charcoal Concrete Floor Slab (Lightened for moonlight bounce)
          floorCenter3D:  new THREE.Color('#2d3748'), 
          floorEdge3D:    new THREE.Color('#1a202c'), 
          floorScanLight: new THREE.Color('#ffffff'),
          trackCenter3D:  new THREE.Color('#1f2937'), 
          trackEdge3D:    new THREE.Color('#111827'),
          trackScanDark:  new THREE.Color('#020408'),
          
          rackUpright:    '#1E293B',
          rackBeam:       '#F59E0B',
          woodPallet:     '#451A03',
          cargoKraft:     '#78350F',
          cargoAmber:     '#B45309',
          cargoTote:      '#F59E0B',
          highBayCargo:   '#EF4444',
          highBayCargoAlt:'#B91C1C',

          forkliftBody:   '#10B981',
          forkliftCab:    '#050811',
          forkliftMast:   '#1E293B',
          forkliftBeacon: '#F59E0B',

          amrChassis:     '#10B981',
          amrBase:        '#050811',
          amrTray:        '#F59E0B',
          amrTote:        '#3B82F6',

          conveyorLeg:    '#1E293B',
          conveyorRoller: '#F59E0B',
          bollardYellow:  '#F59E0B',
          chargePad:      '#10B981',
          laserColor:     0xf59e0b
        }
      };

      const urlParams = new URLSearchParams(window.location.search);
      const initialText = urlParams.get('url') || 'https://yongming.vorky.fyi/';
      const initialMode = urlParams.get('mode');
      if (initialMode && THEMES[initialMode]) {
        activeMode = initialMode;
      }
      let PALETTE = THEMES[activeMode];
      document.getElementById('qr-input').value = initialText;

      function updateBackdropBlobs(themeKey) {
        const t = THEMES[themeKey];
        document.body.style.backgroundColor = t.bgBase;
        document.getElementById('abstract-bg').style.backgroundColor = t.bgBase;
        document.getElementById('blob-1').style.background = t.blob1;
        document.getElementById('blob-2').style.background = t.blob2;
        document.getElementById('blob-3').style.background = t.blob3;
        document.getElementById('bg-vignette').style.background = t.vignette;
      }
      updateBackdropBlobs(activeMode);

      // ==========================================
      // 2. AUDIO ENGINE
      // ==========================================
      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playServoHum() {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.85);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.85);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.85);
        } catch (e) {}
      }

      function playScanChime() {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(2100, audioCtx.currentTime);
          osc2.frequency.setValueAtTime(2800, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(audioCtx.destination);
          osc1.start();
          osc2.start(audioCtx.currentTime + 0.08);
          osc1.stop(audioCtx.currentTime + 0.35);
          osc2.stop(audioCtx.currentTime + 0.35);
        } catch (e) {}
      }

      function playClick() {
        if (!soundEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(950, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        } catch (e) {}
      }

      // ==========================================
      // 3. THREE.JS SCENE SETUP
      // ==========================================
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();

      let width = window.innerWidth;
      let height = window.innerHeight;

      const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 1000);
      const isoPos = new THREE.Vector3(48.0, 46.0, 48.0);
      const isoTarget = new THREE.Vector3(0.0, -3.8, 0.0);
      const flatPos = new THREE.Vector3(0.0, 88.0, 2.501);
      const flatTarget = new THREE.Vector3(0.0, 0.0, 2.5);

      camera.position.copy(isoPos);
      camera.lookAt(isoTarget);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
        preserveDrawingBuffer: true,
        alpha: true
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 16;
      controls.maxDistance = 135;
      controls.target.copy(isoTarget);

      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const unitMaterial = new THREE.MeshStandardMaterial({
        roughness: 0.35,
        metalness: 0.16
      });

      // Lighting Rig (Shift-Adaptive Colors)
      const ambientLight = new THREE.AmbientLight(PALETTE.ambientColor, PALETTE.ambientIntensity);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(PALETTE.sunColor, PALETTE.sunIntensity);
      sunLight.position.set(32, 65, 25);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 160;
      const d = 35;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight(PALETTE.fillColor, PALETTE.fillIntensity);
      fillLight.position.set(-30, 20, -30);
      scene.add(fillLight);

      // --- PROCEDURAL SOFT GAUSSIAN TEXTURE ---
      function createSoftParticleTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.50)');
        grad.addColorStop(0.7, 'rgba(255, 255, 255, 0.10)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(canvas);
      }

      // --- SUBTLE ATMOSPHERIC DUST MOTES ---
      const dustCount = 130;
      const dustGeo = new THREE.BufferGeometry();
      const dustPositions = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount * 3; i += 3) {
        dustPositions[i] = (Math.random() - 0.5) * 48;
        dustPositions[i + 1] = Math.random() * 18;
        dustPositions[i + 2] = (Math.random() - 0.5) * 48;
      }
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      const dustMat = new THREE.PointsMaterial({
        size: 0.48,
        map: createSoftParticleTexture(),
        color: PALETTE.dustColor,
        transparent: true,
        opacity: 0.28,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);

      // Lidar Laser Plane
      const laserGeo = new THREE.PlaneGeometry(36, 0.45);
      const laserMat = new THREE.MeshBasicMaterial({
        color: PALETTE.laserColor,
        transparent: true,
        opacity: 0.0,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending
      });
      const laserPlane = new THREE.Mesh(laserGeo, laserMat);
      laserPlane.rotation.x = Math.PI / 2;
      laserPlane.position.y = 0.35;
      scene.add(laserPlane);

      // Instanced System State
      let instancedMesh = null;
      const dummy = new THREE.Object3D();
      const tempColor = new THREE.Color();
      let currentInstance = 0;
      let floorData = [];
      let dynamicFleet = [];
      const contrastState = { progress: 0 };

      // ==========================================
      // 4. GENERATOR FUNCTIONS (HEAVY BASE PLINTH)
      // ==========================================
      function addBlock(x, y, z, sx, sy, sz, colorHex) {
        if (!instancedMesh) return -1;
        const idx = currentInstance;
        dummy.position.set(x, y + sy / 2, z);
        dummy.scale.set(sx, sy, sz);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(idx, dummy.matrix);

        const col = (colorHex instanceof THREE.Color) ? colorHex.clone() : new THREE.Color(colorHex);
        instancedMesh.setColorAt(idx, col);
        currentInstance++;
        return idx;
      }

      function spawnAlignedRackBay(x, z, tiers, isHighBay = false) {
        const tierHeight = 0.88;
        const totalHeight = tiers * tierHeight;
        const postW = 0.08;
        const offset = 0.42;

        addBlock(x - offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x - offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);

        for (let t = 0; t < tiers; t++) {
          const y = t * tierHeight;
          addBlock(x, y, z - offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x, y, z + offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x - offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);
          addBlock(x + offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);

          addBlock(x, y + 0.06, z, 0.78, 0.07, 0.78, PALETTE.woodPallet);

          let boxColor;
          if (isHighBay) {
            boxColor = (x + z + t) % 2 === 0 ? PALETTE.highBayCargo : PALETTE.highBayCargoAlt;
          } else {
            const seed = (x + z + t);
            boxColor = seed % 3 === 0 ? PALETTE.cargoKraft : (seed % 3 === 1 ? PALETTE.cargoAmber : PALETTE.cargoTote);
          }
          addBlock(x, y + 0.13, z, 0.68, 0.50, 0.68, boxColor);
        }
      }

      // Tall 3D Reach Truck
      function spawnForklift(x, z, dir = 'z') {
        const parts = [];
        function addPart(ox, oy, oz, sx, sy, sz, colorHex) {
          const rx = (dir === 'x') ? -oz : ox;
          const rz = (dir === 'x') ? ox : oz;
          const rsx = (dir === 'x') ? sz : sx;
          const rsz = (dir === 'x') ? sx : sz;

          const idx = addBlock(x + rx, oy, z + rz, rsx, sy, rsz, colorHex);
          parts.push({ ox: rx, oy: oy, oz: rz, sx: rsx, sy: sy, sz: rsz, idx });
        }

        addPart(0, 0.08, 0.12, 0.52, 0.45, 0.42, PALETTE.forkliftBody);
        addPart(0, 0.05, 0.30, 0.50, 0.28, 0.14, PALETTE.forkliftCab);

        addPart(-0.20, 0.53, -0.04, 0.05, 1.05, 0.05, PALETTE.forkliftCab);
        addPart(0.20, 0.53, -0.04, 0.05, 1.05, 0.05, PALETTE.forkliftCab);
        addPart(-0.20, 0.53, 0.22, 0.05, 1.05, 0.05, PALETTE.forkliftCab);
        addPart(0.20, 0.53, 0.22, 0.05, 1.05, 0.05, PALETTE.forkliftCab);
        addPart(0, 1.58, 0.09, 0.46, 0.05, 0.42, PALETTE.forkliftCab);
        addPart(0, 1.63, 0.09, 0.12, 0.10, 0.12, PALETTE.forkliftBeacon);

        addPart(-0.15, 0.05, -0.16, 0.06, 1.80, 0.06, PALETTE.forkliftMast);
        addPart(0.15, 0.05, -0.16, 0.06, 1.80, 0.06, PALETTE.forkliftMast);
        addPart(0, 1.40, -0.16, 0.30, 0.06, 0.04, PALETTE.forkliftMast);

        addPart(0, 0.20, -0.22, 0.42, 0.06, 0.10, PALETTE.forkliftCab);
        addPart(0, 0.22, -0.32, 0.44, 0.08, 0.32, PALETTE.woodPallet);
        addPart(0, 0.30, -0.32, 0.38, 0.44, 0.28, PALETTE.cargoKraft);

        dynamicFleet.push({
          baseX: x, baseZ: z, dir: dir,
          range: 0.50,
          speed: 1.6 + Math.random() * 0.4,
          phase: Math.random() * Math.PI * 2,
          parts: parts
        });
      }

      // Layered 3D AMR
      function spawnAMR(x, z, dir = 'z') {
        const parts = [];
        function addPart(ox, oy, oz, sx, sy, sz, colorHex) {
          const rx = (dir === 'x') ? -oz : ox;
          const rz = (dir === 'x') ? ox : oz;
          const rsx = (dir === 'x') ? sz : sx;
          const rsz = (dir === 'x') ? sx : sz;

          const idx = addBlock(x + rx, oy, z + rz, rsx, sy, rsz, colorHex);
          parts.push({ ox: rx, oy: oy, oz: rz, sx: rsx, sy: sy, sz: rsz, idx });
        }

        addPart(0, 0.05, 0, 0.72, 0.16, 0.72, PALETTE.amrBase);
        addPart(0, 0.21, 0, 0.64, 0.24, 0.64, PALETTE.amrChassis);
        addPart(0, 0.45, 0, 0.58, 0.06, 0.58, PALETTE.amrTray);
        addPart(0, 0.51, 0, 0.48, 0.30, 0.48, PALETTE.amrTote);
        addPart(0, 0.36, -0.30, 0.16, 0.12, 0.12, PALETTE.amrBase);

        dynamicFleet.push({
          baseX: x, baseZ: z, dir: dir,
          range: 0.50,
          speed: 2.2 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
          parts: parts
        });
      }

      function spawnPalletStack(x, z) {
        for (let i = 0; i < 4; i++) {
          addBlock(x, i * 0.11, z, 0.72, 0.08, 0.72, PALETTE.woodPallet);
        }
      }

      function spawnConveyor(x, z, horizontal) {
        addBlock(x, 0.05, z, horizontal ? 0.90 : 0.55, 0.22, horizontal ? 0.55 : 0.90, PALETTE.conveyorLeg);
        addBlock(x, 0.27, z, horizontal ? 0.86 : 0.48, 0.05, horizontal ? 0.48 : 0.86, PALETTE.conveyorRoller);
        addBlock(x, 0.32, z, 0.44, 0.24, 0.44, PALETTE.amrTote);
      }

      function spawnChargingDock(x, z) {
        addBlock(x, 0.04, z, 0.78, 0.06, 0.78, PALETTE.amrBase);
        addBlock(x, 0.10, z, 0.46, 0.04, 0.46, PALETTE.chargePad);
      }

      function spawnSafetyBollards(x, z) {
        const offset = 0.28;
        addBlock(x - offset, 0.05, z - offset, 0.14, 0.70, 0.14, PALETTE.bollardYellow);
        addBlock(x + offset, 0.05, z + offset, 0.14, 0.70, 0.14, PALETTE.bollardYellow);
      }

      function updateFloorTransition(progress) {
        if (!instancedMesh) return;
        const scratch = new THREE.Color();
        for (let i = 0; i < floorData.length; i++) {
          const item = floorData[i];
          scratch.lerpColors(item.col3D, item.colScan, progress);
          instancedMesh.setColorAt(item.idx, scratch);
        }
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
      }

      function triggerLidarSweep() {
        laserPlane.position.z = -17;
        laserMat.opacity = 0.85;
        gsap.to(laserPlane.position, {
          z: 17,
          duration: 1.1,
          ease: "power2.inOut",
          onComplete: () => {
            gsap.to(laserMat, { opacity: 0.0, duration: 0.3 });
            playScanChime();
          }
        });
      }

      function generateFacility(text) {
        if (instancedMesh) {
          scene.remove(instancedMesh);
          instancedMesh.geometry.dispose();
          instancedMesh = null;
        }

        floorData = [];
        dynamicFleet = [];
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const size = qr.getModuleCount();
        const center = size / 2;
        const maxRadius = size * 0.707;
        const highBayRadius = size * 0.18;
        const rackRadius = size * 0.37;

        instancedMesh = new THREE.InstancedMesh(boxGeo, unitMaterial, 22000);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        currentInstance = 0;

        const occupiedClearance = new Set();
        function markClearance(c, r) {
          for (let dc = -1; dc <= 1; dc++) {
            for (let dr = -1; dr <= 1; dr++) {
              occupiedClearance.add(`${c + dc},${r + dr}`);
            }
          }
        }

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isDark = qr.isDark(r, c);
            const posX = c - center + 0.5;
            const posZ = r - center + 0.5;
            const dist = Math.hypot(posX, posZ);
            const normDist = Math.min(1.0, dist / maxRadius);

            const colLight3D = new THREE.Color().lerpColors(PALETTE.floorCenter3D, PALETTE.floorEdge3D, normDist * 0.95);
            const colDark3D  = new THREE.Color().lerpColors(PALETTE.trackCenter3D, PALETTE.trackEdge3D, normDist * 0.95);

            if (!isDark) {
              // REINFORCED 1.25 THICK INDUSTRIAL CONCRETE PLINTH!
              const idx = addBlock(posX, -1.25, posZ, 0.98, 1.25, 0.98, colLight3D);
              floorData.push({ idx, col3D: colLight3D, colScan: PALETTE.floorScanLight });
            } else {
              // REINFORCED 1.27 THICK TRANSIT GUIDE SLAB!
              const idx = addBlock(posX, -1.25, posZ, 0.98, 1.27, 0.98, colDark3D);
              floorData.push({ idx, col3D: colDark3D, colScan: PALETTE.trackScanDark });

              if (dist < highBayRadius) {
                spawnAlignedRackBay(posX, posZ, 5, true);
              } else if (dist < rackRadius) {
                spawnAlignedRackBay(posX, posZ, 3, false);
              } else {
                const seed = (r * 13 + c * 7);
                const coordKey = `${c},${r}`;

                if (seed % 19 === 0 && !occupiedClearance.has(coordKey)) {
                  const driveDir = (r % 2 === 0) ? 'z' : 'x';
                  spawnForklift(posX, posZ, driveDir);
                  markClearance(c, r);
                } else if (seed % 17 === 2 && !occupiedClearance.has(coordKey)) {
                  spawnPalletStack(posX, posZ);
                  markClearance(c, r);
                } else if (seed % 23 === 1) {
                  spawnConveyor(posX, posZ, r % 2 === 0);
                } else if (seed % 29 === 3) {
                  spawnChargingDock(posX, posZ);
                } else if (seed % 21 === 4) {
                  spawnSafetyBollards(posX, posZ);
                } else if (seed % 5 === 0) {
                  spawnAMR(posX, posZ, (c % 2 === 0 ? 'z' : 'x'));
                }
              }
            }
          }
        }

        instancedMesh.count = currentInstance;
        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        // Smooth Lighting & Reflection Transition
        gsap.to(sunLight.color, { r: new THREE.Color(PALETTE.sunColor).r, g: new THREE.Color(PALETTE.sunColor).g, b: new THREE.Color(PALETTE.sunColor).b, duration: 1.2 });
        gsap.to(sunLight, { intensity: PALETTE.sunIntensity, duration: 1.2 });

        gsap.to(fillLight.color, { r: new THREE.Color(PALETTE.fillColor).r, g: new THREE.Color(PALETTE.fillColor).g, b: new THREE.Color(PALETTE.fillColor).b, duration: 1.2 });
        gsap.to(fillLight, { intensity: PALETTE.fillIntensity, duration: 1.2 });

        gsap.to(ambientLight.color, { r: new THREE.Color(PALETTE.ambientColor).r, g: new THREE.Color(PALETTE.ambientColor).g, b: new THREE.Color(PALETTE.ambientColor).b, duration: 1.2 });
        gsap.to(ambientLight, { intensity: PALETTE.ambientIntensity, duration: 1.2 });

        laserMat.color.setHex(PALETTE.laserColor);
        dustMat.color.setHex(PALETTE.dustColor);

        updateFloorTransition(isFlat ? 1 : 0);
      }

      // ==========================================
      // 5. VIEW TOGGLE & CAMERA CENTERING
      // ==========================================
      const tapBadge = document.getElementById('tap-badge');
      const badgeText = document.getElementById('badge-text');

      function toggleView() {
        initAudio();
        isFlat = !isFlat;
        badgeText.textContent = isFlat ? "Tap to see 3D view" : "Tap the warehouse to see QR code";

        const destPos = isFlat ? flatPos : isoPos;
        const destTarget = isFlat ? flatTarget : isoTarget;

        controls.enabled = false;
        playServoHum();

        gsap.to(camera.position, {
          x: destPos.x,
          y: destPos.y,
          z: destPos.z,
          duration: 1.2,
          ease: "power3.inOut"
        });

        gsap.to(controls.target, {
          x: destTarget.x,
          y: destTarget.y,
          z: destTarget.z,
          duration: 1.2,
          ease: "power3.inOut",
          onUpdate: () => {
            camera.lookAt(controls.target);
          },
          onComplete: () => {
            controls.enabled = !isFlat;
            if (isFlat) triggerLidarSweep();
          }
        });

        gsap.to(contrastState, {
          progress: isFlat ? 1 : 0,
          duration: 1.2,
          ease: "power2.inOut",
          onUpdate: () => updateFloorTransition(contrastState.progress)
        });

        gsap.to(unitMaterial, {
          roughness: isFlat ? 0.95 : 0.35,
          metalness: isFlat ? 0.02 : 0.16,
          duration: 1.2,
          ease: "power2.inOut"
        });

        gsap.to(sunLight, { intensity: isFlat ? 0.6 : PALETTE.sunIntensity, duration: 1.2 });
        gsap.to(ambientLight, { intensity: isFlat ? 1.2 : PALETTE.ambientIntensity, duration: 1.2 });

        if (isFlat && instancedMesh) {
          for (let f = 0; f < dynamicFleet.length; f++) {
            const unit = dynamicFleet[f];
            for (let p = 0; p < unit.parts.length; p++) {
              const part = unit.parts[p];
              dummy.position.set(unit.baseX + part.ox, part.oy + part.sy / 2, unit.baseZ + part.oz);
              dummy.scale.set(part.sx, part.sy, part.sz);
              dummy.rotation.set(0, 0, 0);
              dummy.updateMatrix();
              instancedMesh.setMatrixAt(part.idx, dummy.matrix);
            }
          }
          instancedMesh.instanceMatrix.needsUpdate = true;
        }
      }

      tapBadge.addEventListener('click', toggleView);

      // Canvas Tap Handler
      let pointerDownPos = { x: 0, y: 0 };
      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', (e) => {
        if (e.target.closest('.bottom-control-panel') || e.target.closest('.tap-badge')) return;
        const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
        if (dist < 6) {
          toggleView();
        }
      });

      // Submit URL
      const input = document.getElementById('qr-input');
      const submitBtn = document.getElementById('submit-btn');
      function handleUpdate() {
        initAudio();
        playClick();
        if (input.value.trim().length > 0) {
          generateFacility(input.value.trim());
        }
      }
      submitBtn.addEventListener('click', handleUpdate);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleUpdate();
      });

      // Mode Switcher Buttons
      const modeTabs = document.querySelectorAll('.mode-tab');
      modeTabs.forEach(t => {
        if (t.dataset.mode === activeMode) t.classList.add('active');
        else t.classList.remove('active');
      });

      modeTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          initAudio();
          playClick();
          modeTabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activeMode = tab.dataset.mode;
          PALETTE = THEMES[activeMode];

          updateBackdropBlobs(activeMode);
          generateFacility(input.value.trim());
        });
      });

      // Snapshot & Share Tool
      const shareBtn = document.getElementById('share-btn');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2600);
      }

      shareBtn.addEventListener('click', () => {
        initAudio();
        playClick();

        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = `autonomous-warehouse-${isFlat ? 'qr' : '3d'}.png`;
        link.href = dataURL;
        link.click();

        const shareUrl = new URL(window.location.origin + window.location.pathname);
        shareUrl.searchParams.set('url', input.value.trim());
        shareUrl.searchParams.set('mode', activeMode);
        navigator.clipboard.writeText(shareUrl.toString()).then(() => {
          showToast("Snapshot saved & link copied!");
        }).catch(() => {
          showToast("Snapshot downloaded!");
        });
      });

      // Audio Toggle Button
      const audioBtn = document.getElementById('audio-btn');
      const audioIconOn = document.getElementById('audio-icon-on');
      const audioIconOff = document.getElementById('audio-icon-off');

      audioBtn.addEventListener('click', () => {
        initAudio();
        soundEnabled = !soundEnabled;
        if (soundEnabled) {
          audioIconOn.style.display = 'block';
          audioIconOff.style.display = 'none';
          audioBtn.classList.add('active');
          playClick();
        } else {
          audioIconOn.style.display = 'none';
          audioIconOff.style.display = 'block';
          audioBtn.classList.remove('active');
        }
      });

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });

      // ==========================================
      // 6. INITIALIZATION & RENDER LOOP
      // ==========================================
      generateFacility(input.value.trim());

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        if (controls.enabled) {
          controls.update();
        }

        // Delicate, soft dust motes drift
        if (dustParticles) {
          const positions = dustGeo.attributes.position.array;
          for (let i = 0; i < dustPositions.length; i += 3) {
            positions[i + 1] -= 0.015;
            positions[i] += Math.sin(elapsedTime * 0.4 + i) * 0.008;
            if (positions[i + 1] < 0) {
              positions[i + 1] = 18;
            }
          }
          dustGeo.attributes.position.needsUpdate = true;
          dustParticles.rotation.y = elapsedTime * 0.02;
        }

        // Active Cruising Motion in 3D
        if (instancedMesh && !isFlat) {
          for (let f = 0; f < dynamicFleet.length; f++) {
            const unit = dynamicFleet[f];
            const moveOffset = Math.sin(elapsedTime * unit.speed + unit.phase) * unit.range;

            for (let p = 0; p < unit.parts.length; p++) {
              const part = unit.parts[p];
              const curX = (unit.dir === 'x') ? unit.baseX + part.ox + moveOffset : unit.baseX + part.ox;
              const curY = part.oy + part.sy / 2;
              const curZ = (unit.dir === 'z') ? unit.baseZ + part.oz + moveOffset : unit.baseZ + part.oz;

              dummy.position.set(curX, curY, curZ);
              dummy.scale.set(part.sx, part.sy, part.sz);
              dummy.rotation.set(0, 0, 0);
              dummy.updateMatrix();
              instancedMesh.setMatrixAt(part.idx, dummy.matrix);
            }
          }
          instancedMesh.instanceMatrix.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
