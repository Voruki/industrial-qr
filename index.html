<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autonomous Intralogistics Facility - 3D QR</title>
    <!-- Stable Browser CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #080b12;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        overflow: hidden;
        user-select: none;
      }
      #webgl-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      .ui-overlay {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        background: rgba(12, 16, 26, 0.92);
        backdrop-filter: blur(14px);
        padding: 8px 12px;
        border-radius: 9999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.9);
        z-index: 10;
      }
      .ui-input {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 9px 18px;
        border-radius: 9999px;
        color: #fff;
        outline: none;
        font-size: 14px;
        min-width: 260px;
      }
      .ui-input:focus { border-color: #3b82f6; }
      .ui-btn {
        background: #2563eb;
        color: #fff;
        border: none;
        padding: 9px 22px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        white-space: nowrap;
      }
      .ui-btn:hover { background: #1d4ed8; }
      .ui-btn:active { transform: scale(0.97); }
      .hint {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        pointer-events: none;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="ui-overlay">
      <input id="qr-input" class="ui-input" type="text" value="https://voruki.github.io/industrial-qr/" placeholder="Enter URL or text..." />
      <button id="toggle-btn" class="ui-btn">Flatten to Scan</button>
    </div>
    <div class="hint">Click & drag to orbit · Tap button to scan</div>
    <div id="webgl-container"></div>

    <script>
      // --- INDUSTRIAL COLOR PALETTE (RAL & VDA STANDARDS) ---
      const PALETTE = {
        // Floor 3D Gradient Targets
        floorCenter3D:  new THREE.Color('#4c5565'), // Polished concrete illuminated center
        floorEdge3D:    new THREE.Color('#141822'), // Dark charcoal perimeter falloff
        floorScanLight: new THREE.Color('#f8fafc'), // 2D Scan white background

        trackCenter3D:  new THREE.Color('#222936'), // Dark transit floor center
        trackEdge3D:    new THREE.Color('#0b0e14'), // Dark transit floor edge
        trackScanDark:  new THREE.Color('#020617'), // 2D Scan black foreground

        // Structural Racking
        rackUpright: '#1E3A8A',    // RAL 5010 Industrial Blue Posts
        rackBeam:    '#EA580C',    // RAL 2004 Industrial Orange Load Crossbeams
        woodPallet:  '#854D0E',    // Euro Pallet Timber

        // Standard 3-Tier Selective Cargo (Mid-Zone)
        cargoBox:    '#94A3B8',    // Stretch-wrapped light grey parcels
        cargoBoxAlt: '#A16207',    // Corrugated kraft cartons

        // High-Bay 5-Tier AS/RS Core Cargo (RAL 3001/3000 Signal & Flame Red Priority Totes)
        highBayCargo:    '#B91C1C', // RAL 3001 Signal Red AS/RS Bin
        highBayCargoAlt: '#991B1B', // RAL 3000 Flame Red High-Value Container

        // Fleet: Forklifts & Reach Trucks
        forkliftBody: '#EAB308',   // Safety Traffic Yellow
        forkliftCab:  '#0F172A',   // Overhead Safety Guard
        forkliftMast: '#475569',   // Vertical Mast Steel

        // Fleet: Ground AMRs
        amrChassis:  '#CA8A04',    // Industrial Yellow Shell
        amrBase:     '#1E293B',    // Drive Base Charcoal
        amrTote:     '#2563EB',    // Blue Picking Tote

        // Infrastructure
        conveyorLeg: '#334155',    // Conveyor Stand
        conveyorRoller: '#CBD5E1', // Steel Rollers
        bollardYellow: '#FACC15',  // Crash Safety Bollards
        chargePad: '#10B981'       // Inductive Dock LED
      };

      // --- THREE.JS SCENE SETUP ---
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#080b12');

      let width = window.innerWidth;
      let height = window.innerHeight;

      const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
      const isoPos = new THREE.Vector3(38, 44, 38);
      const flatPos = new THREE.Vector3(0, 60, -0.001);
      camera.position.copy(isoPos);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // High-Bay Warehouse Lighting
      const ambientLight = new THREE.AmbientLight('#ffffff', 0.85);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight('#fff8eb', 2.0);
      sunLight.position.set(35, 65, 25);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 160;
      const d = 35;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      const fillLight = new THREE.DirectionalLight('#38bdf8', 0.35);
      fillLight.position.set(-30, 20, -30);
      scene.add(fillLight);

      // Foundation Slab Ground Plate
      const groundPlateGeo = new THREE.BoxGeometry(90, 0.2, 90);
      const groundPlateMat = new THREE.MeshStandardMaterial({
        color: 0x0c1018,
        roughness: 0.9,
        metalness: 0.1
      });
      const groundPlate = new THREE.Mesh(groundPlateGeo, groundPlateMat);
      groundPlate.position.y = -0.15;
      groundPlate.receiveShadow = true;
      scene.add(groundPlate);

      // --- INSTANCED RENDERING SYSTEM ---
      const boxGeo = new THREE.BoxGeometry(1, 1, 1);
      const unitMaterial = new THREE.MeshStandardMaterial({
        roughness: 0.4,
        metalness: 0.15
      });

      let instancedMesh = null;
      const dummy = new THREE.Object3D();
      const tempColor = new THREE.Color();
      let currentInstance = 0;

      let floorData = [];

      function addBlock(x, y, z, sx, sy, sz, colorHex) {
        if (!instancedMesh) return -1;
        const idx = currentInstance;
        dummy.position.set(x, y + sy / 2, z);
        dummy.scale.set(sx, sy, sz);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(idx, dummy.matrix);
        instancedMesh.setColorAt(idx, tempColor.set(colorHex));
        currentInstance++;
        return idx;
      }

      // --- PROCEDURAL ALIGNED RACK BAY ---
      function spawnAlignedRackBay(x, z, tiers, isHighBay = false) {
        const tierHeight = 0.88;
        const totalHeight = tiers * tierHeight;
        const postW = 0.08;
        const offset = 0.42;

        // 4 Blue Structural Steel Uprights
        addBlock(x - offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z - offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x - offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);
        addBlock(x + offset, 0, z + offset, postW, totalHeight, postW, PALETTE.rackUpright);

        // Uniform Storage Levels
        for (let t = 0; t < tiers; t++) {
          const y = t * tierHeight;
          // Orange Load Crossbeams
          addBlock(x, y, z - offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x, y, z + offset, 0.92, 0.06, postW, PALETTE.rackBeam);
          addBlock(x - offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);
          addBlock(x + offset, y, z, postW, 0.06, 0.92, PALETTE.rackBeam);

          // Wood Euro Pallet
          addBlock(x, y + 0.06, z, 0.78, 0.07, 0.78, PALETTE.woodPallet);

          // Cargo Load: High-Bay Red Priority Totes vs Standard Selective Cartons
          let boxColor;
          if (isHighBay) {
            boxColor = (x + z + t) % 2 === 0 ? PALETTE.highBayCargo : PALETTE.highBayCargoAlt;
          } else {
            boxColor = (x + z + t) % 2 === 0 ? PALETTE.cargoBox : PALETTE.cargoBoxAlt;
          }

          addBlock(x, y + 0.13, z, 0.68, 0.50, 0.68, boxColor);
        }
      }

      // Forklift / Reach Truck
      function spawnForklift(x, z, angle) {
        dummy.rotation.y = angle;

        addBlock(x, 0.05, z + 0.1, 0.65, 0.35, 0.55, PALETTE.forkliftBody);

        addBlock(x - 0.24, 0.40, z - 0.05, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addBlock(x + 0.24, 0.40, z - 0.05, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addBlock(x - 0.24, 0.40, z + 0.25, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addBlock(x + 0.24, 0.40, z + 0.25, 0.05, 0.50, 0.05, PALETTE.forkliftCab);
        addBlock(x, 0.90, z + 0.1, 0.55, 0.04, 0.55, PALETTE.forkliftCab);

        addBlock(x - 0.18, 0.05, z - 0.25, 0.06, 1.15, 0.06, PALETTE.forkliftMast);
        addBlock(x + 0.18, 0.05, z - 0.25, 0.06, 1.15, 0.06, PALETTE.forkliftMast);
        addBlock(x, 0.15, z - 0.38, 0.55, 0.06, 0.55, PALETTE.woodPallet);
        addBlock(x, 0.21, z - 0.38, 0.48, 0.40, 0.48, PALETTE.cargoBoxAlt);
      }

      // Ground AMR
      function spawnAMR(x, z) {
        addBlock(x, 0.05, z, 0.76, 0.14, 0.76, PALETTE.amrBase);
        addBlock(x, 0.19, z, 0.68, 0.16, 0.68, PALETTE.amrChassis);
        addBlock(x, 0.35, z, 0.54, 0.24, 0.54, PALETTE.amrTote);
      }

      // Staging Pallet Stack
      function spawnPalletStack(x, z) {
        for (let i = 0; i < 4; i++) {
          addBlock(x, i * 0.11, z, 0.76, 0.08, 0.76, PALETTE.woodPallet);
        }
      }

      // Roller Conveyor Spur
      function spawnConveyor(x, z, horizontal) {
        addBlock(x, 0.05, z, horizontal ? 0.94 : 0.60, 0.25, horizontal ? 0.60 : 0.94, PALETTE.conveyorLeg);
        addBlock(x, 0.30, z, horizontal ? 0.90 : 0.52, 0.06, horizontal ? 0.52 : 0.90, PALETTE.conveyorRoller);
        addBlock(x, 0.36, z, 0.48, 0.26, 0.48, PALETTE.amrTote);
      }

      // Inductive Charging Dock
      function spawnChargingDock(x, z) {
        addBlock(x, 0.04, z, 0.82, 0.06, 0.82, PALETTE.amrBase);
        addBlock(x, 0.10, z, 0.50, 0.04, 0.50, PALETTE.chargePad);
      }

      // Heavy Safety Bollards
      function spawnSafetyBollards(x, z) {
        const offset = 0.28;
        addBlock(x - offset, 0.05, z - offset, 0.14, 0.75, 0.14, PALETTE.bollardYellow);
        addBlock(x + offset, 0.05, z + offset, 0.14, 0.75, 0.14, PALETTE.bollardYellow);
      }

      // --- FACILITY GENERATOR ---
      function generateFacility(text) {
        if (instancedMesh) {
          scene.remove(instancedMesh);
          instancedMesh.geometry.dispose();
          instancedMesh = null;
        }

        floorData = [];
        const qr = qrcode(0, 'H');
        qr.addData(text);
        qr.make();

        const size = qr.getModuleCount();
        const center = size / 2;
        const maxRadius = size * 0.707;
        
        const highBayRadius = size * 0.18; // Central High-Bay AS/RS zone
        const rackRadius = size * 0.37;    // Intermediate selective rack zone

        instancedMesh = new THREE.InstancedMesh(boxGeo, unitMaterial, 20000);
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;
        currentInstance = 0;

        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) {
            const isDark = qr.isDark(r, c);
            const posX = c - center + 0.5;
            const posZ = r - center + 0.5;
            const dist = Math.hypot(posX, posZ);
            const normDist = Math.min(1.0, dist / maxRadius);

            const colLight3D = new THREE.Color().lerpColors(PALETTE.floorCenter3D, PALETTE.floorEdge3D, normDist * 0.95);
            const colDark3D  = new THREE.Color().lerpColors(PALETTE.trackCenter3D, PALETTE.trackEdge3D, normDist * 0.95);

            if (!isDark) {
              const idx = addBlock(posX, 0, posZ, 0.98, 0.08, 0.98, '#4c5565');
              floorData.push({ idx, type: 'light', col3D: colLight3D });
            } else {
              const idx = addBlock(posX, 0, posZ, 0.98, 0.10, 0.98, '#222936');
              floorData.push({ idx, type: 'dark', col3D: colDark3D });

              // ZONE 1A: Central High-Bay AS/RS Core (Clean FLAT 5-Tier Plateau with RED PRIORITY TOTES)
              if (dist < highBayRadius) {
                spawnAlignedRackBay(posX, posZ, 5, true);
              }
              // ZONE 1B: Mid-Zone Selective Racking (Clean FLAT 3-Tier Plateau with STANDARD CARGO)
              else if (dist < rackRadius) {
                spawnAlignedRackBay(posX, posZ, 3, false);
              }
              // ZONE 2: Surrounding Infrastructure & Fleet
              else {
                const seed = (r * 13 + c * 7);

                if (seed % 17 === 0) {
                  spawnForklift(posX, posZ, (r % 2 === 0 ? 0 : Math.PI / 2));
                } else if (seed % 19 === 1) {
                  spawnConveyor(posX, posZ, r % 2 === 0);
                } else if (seed % 13 === 2) {
                  spawnPalletStack(posX, posZ);
                } else if (seed % 23 === 3) {
                  spawnChargingDock(posX, posZ);
                } else if (seed % 21 === 4) {
                  spawnSafetyBollards(posX, posZ);
                } else if (seed % 4 === 0) {
                  spawnAMR(posX, posZ);
                }
              }
            }
          }
        }

        instancedMesh.count = currentInstance;
        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        updateFloorContrast(0);
      }

      // Initial Build
      const input = document.getElementById('qr-input');
      generateFacility(input.value.trim());

      // --- FLOOR CONTRAST INTERPOLATION ---
      const contrastState = { progress: 0 };

      function updateFloorContrast(progress) {
        if (!instancedMesh) return;
        const scratch = new THREE.Color();

        for (let i = 0; i < floorData.length; i++) {
          const item = floorData[i];
          if (item.type === 'light') {
            scratch.lerpColors(item.col3D, PALETTE.floorScanLight, progress);
          } else {
            scratch.lerpColors(item.col3D, PALETTE.trackScanDark, progress);
          }
          instancedMesh.setColorAt(item.idx, scratch);
        }
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
      }

      // --- VIEW TOGGLE & CAMERA ANIMATION ---
      let isFlat = false;
      let autoRotate = true;
      const toggleBtn = document.getElementById('toggle-btn');

      function toggleView() {
        isFlat = !isFlat;
        autoRotate = false;
        toggleBtn.textContent = isFlat ? "3D Warehouse View" : "Flatten to Scan";
        const target = isFlat ? flatPos : isoPos;

        gsap.to(camera.position, {
          x: target.x,
          y: target.y,
          z: target.z,
          duration: 1.2,
          ease: "power3.inOut",
          onUpdate: () => camera.lookAt(0, 0, 0)
        });

        gsap.to(contrastState, {
          progress: isFlat ? 1 : 0,
          duration: 1.2,
          ease: "power2.inOut",
          onUpdate: () => updateFloorContrast(contrastState.progress)
        });

        gsap.to(sunLight, { intensity: isFlat ? 1.0 : 2.0, duration: 1.2 });
        gsap.to(ambientLight, { intensity: isFlat ? 1.9 : 0.85, duration: 1.2 });
        gsap.to(groundPlate.position, { y: isFlat ? -5 : -0.15, duration: 0.8 });
      }

      toggleBtn.addEventListener('click', toggleView);

      input.addEventListener('change', () => {
        if (input.value.trim().length > 0) generateFacility(input.value.trim());
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim().length > 0) generateFacility(input.value.trim());
      });

      // --- MOUSE & TOUCH ORBIT ---
      let isDragging = false;
      let prevPointer = { x: 0, y: 0 };

      window.addEventListener('pointerdown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        isDragging = true;
        autoRotate = false;
        prevPointer = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging || isFlat) return;
        const deltaX = (e.clientX - prevPointer.x) * 0.006;
        const deltaY = (e.clientY - prevPointer.y) * 0.006;

        const radius = Math.hypot(camera.position.x, camera.position.z);
        let angle = Math.atan2(camera.position.z, camera.position.x) + deltaX;

        camera.position.x = radius * Math.cos(angle);
        camera.position.z = radius * Math.sin(angle);
        camera.position.y = Math.max(14, Math.min(65, camera.position.y - deltaY * 16));
        camera.lookAt(0, 0, 0);

        prevPointer = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointerup', () => { isDragging = false; });

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });

      // --- RENDER LOOP ---
      function animate() {
        requestAnimationFrame(animate);

        if (autoRotate && !isFlat && !isDragging) {
          const radius = Math.hypot(camera.position.x, camera.position.z);
          let angle = Math.atan2(camera.position.z, camera.position.x) + 0.0022;
          camera.position.x = radius * Math.cos(angle);
          camera.position.z = radius * Math.sin(angle);
          camera.lookAt(0, 0, 0);
        }

        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
